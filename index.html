
<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <meta name="theme-color" content="#230b38" />

    <!-- Título oficial -->
    <title>JAIVISA | Portal Mayorista</title>

    <!-- Descripción para buscadores -->
    <meta
      name="description"
      content="Todo lo que necesitas para tu negocio, en un solo lugar. Haz tus pedidos mayoristas fácilmente."
    />

    <!-- Identidad de la aplicación -->
    <meta
      name="application-name"
      content="JAIVISA Mayorista"
    />

    <meta
      name="apple-mobile-web-app-capable"
      content="yes"
    />

    <meta
      name="apple-mobile-web-app-title"
      content="JAIVISA"
    />

    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="default"
    />

    <!-- WhatsApp, Facebook y redes sociales -->
    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:url"
      content="https://mayorista.jaivisa.com/"
    />

    <meta
      property="og:site_name"
      content="JAIVISA"
    />

    <meta
      property="og:locale"
      content="es_CO"
    />

    <meta
      property="og:title"
      content="JAIVISA | Portal Mayorista"
    />

    <meta
      property="og:description"
      content="Todo lo que necesitas para tu negocio, en un solo lugar. Haz tus pedidos mayoristas fácilmente."
    />

    <!-- Imagen oficial de WhatsApp -->
    <meta
      property="og:image"
      content="https://mayorista.jaivisa.com/jaivisa-whatsapp.png"
    />

    <meta
      property="og:image:secure_url"
      content="https://mayorista.jaivisa.com/jaivisa-whatsapp.png"
    />

    <meta
      property="og:image:type"
      content="image/png"
    />

    <meta
      property="og:image:alt"
      content="JAIVISA | Portal Mayorista"
    />

    <!-- Vista previa para otras redes -->
    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:title"
      content="JAIVISA | Portal Mayorista"
    />

    <meta
      name="twitter:description"
      content="Todo lo que necesitas para tu negocio, en un solo lugar. Haz tus pedidos mayoristas fácilmente."
    />

    <meta
      name="twitter:image"
      content="https://mayorista.jaivisa.com/jaivisa-whatsapp.png"
    />

    <!-- Favicon oficial existente -->
    <link
      rel="icon"
      type="image/x-icon"
      href="/favicon-jaivisa-next.ico"
    />

    <!-- Ícono para dispositivos Apple -->
    <link
      rel="apple-touch-icon"
      href="/icon-192.png"
    />
  </head>

  <body>
    <div id="root"></div>

    <!-- Aplicación React -->
    <script
      type="module"
      src="/src/main.tsx"
    ></script>
  </body>
</html>
